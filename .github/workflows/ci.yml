name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - run: npm ci
        working-directory: workbench
      - run: npm run build
        working-directory: workbench
